name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual staging redeploy of one side, from develop. It runs that side's
  # checks and e2e first, then deploys as a push would.
  workflow_dispatch:
    inputs:
      target:
        description: Side of staging to rebuild and redeploy (run on develop)
        type: choice
        options: [backend, frontend, both]
        default: backend
        required: true

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # A manual run takes its sides from the input instead of the path
    # filters; its "false" is a non-empty string, so it wins over the empty
    # filter output in `||`.
    outputs:
      backend: ${{ steps.dispatch.outputs.backend || steps.filter.outputs.backend }}
      frontend: ${{ steps.dispatch.outputs.frontend || steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
      deploy_backend: ${{ steps.dispatch.outputs.backend || steps.deploy-filter.outputs.backend }}
      deploy_frontend: ${{ steps.dispatch.outputs.frontend || steps.deploy-filter.outputs.frontend }}
    steps:
      - name: Manual redeploy target
        id: dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "develop" ]; then
            echo "::error::A manual redeploy runs on develop only (got $REF_NAME)"
            exit 1
          fi
          case "$TARGET" in
            backend)  backend=true;  frontend=false ;;
            frontend) backend=false; frontend=true ;;
            both)     backend=true;  frontend=true ;;
            *) echo "::error::Unknown target: $TARGET"; exit 1 ;;
          esac
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            stack:
              - 'docker-compose.yml'

      # What to redeploy: compare with the branch's own previous commit. Without
      # a base, a push to develop is compared with main and redeploys whatever
      # is unreleased. Redeploying the backend restarts processing (an ownership
      # handover that fails the jobs in flight), so a frontend-only push must
      # not touch it.
      - uses: dorny/paths-filter@v4
        id: deploy-filter
        if: ${{ github.event_name == 'push' }}
        with:
          base: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-ci:
    name: Backend CI
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag is published
        with:
          version: "0.9.18"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy app tests

      - name: Unit tests
        run: uv run pytest tests/unit -v

      # testcontainers starts a pgvector/pgvector:pg16 container via the
      # runner's Docker daemon; nothing else to provision.
      - name: Integration tests
        run: uv run pytest tests/integration -v

  frontend-ci:
    name: Frontend CI
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.stack == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── Stack: the same images and compose file as `make dev-build` ──
      # docker-compose.yml keeps LOCAL_AUTH_ENABLED=true on the backend.
      # Staging and production are Microsoft SSO only; the E2E suite cannot do
      # an interactive Microsoft sign-in, so it signs in through the API.
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      # ── Migrations, from the runner as `make migrate` does ──
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag is published
        with:
          version: "0.9.18"
          python-version: "3.12"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      # ── Playwright ──
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v

  # Builds and redeploys only after every check above passed or was skipped.
  # Only develop -> staging for now; main -> production is added when the
  # production infrastructure is applied. Identifiers are repository variables
  # (none are secret with OIDC); their values are the Terraform outputs. The
  # job is skipped until AWS_ROLE_ARN is set, so CI stays green before the
  # staging infrastructure exists. A manual run (workflow_dispatch) deploys
  # the side it names, after that side's checks.
  deploy-staging:
    name: Deploy to staging
    needs: [changes, backend-ci, frontend-ci, e2e-tests]
    if: >-
      ${{ !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == 'develop'
      && vars.AWS_ROLE_ARN != ''
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_frontend == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      IMAGE_TAG: staging-latest
      BACKEND_IMAGE: ${{ vars.ECR_REGISTRY }}/pmo-intelligence-backend
      FRONTEND_IMAGE: ${{ vars.ECR_REGISTRY }}/pmo-intelligence-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        if: ${{ needs.changes.outputs.deploy_backend == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-to: type=inline

      - name: Build and push frontend
        if: ${{ needs.changes.outputs.deploy_frontend == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-to: type=inline

      - name: Deploy backend to ECS
        if: ${{ needs.changes.outputs.deploy_backend == 'true' }}
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_STAGING_BACKEND_SERVICE }}" \
            --force-new-deployment

      - name: Deploy frontend to ECS
        if: ${{ needs.changes.outputs.deploy_frontend == 'true' }}
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_STAGING_FRONTEND_SERVICE }}" \
            --force-new-deployment
