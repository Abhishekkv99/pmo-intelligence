[project]
name = "pmo-intelligence-backend"
version = "0.1.0"
description = "PMO Intelligence - FastAPI Backend"
authors = [
    { name = "Abhishek Kumar Verma", email = "ruhul10101@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.18.3",
    "assemblyai>=0.35.0",
    "asyncpg>=0.31.0",
    "aioboto3>=13.4.0",
    "fastapi>=0.128.6",
    "httpx>=0.28.1",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.0",
    "openai>=1.60.0",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.40.0",
    "PyJWT>=2.11.0",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.0.0",
    "slowapi>=0.1.9",
    "cryptography>=46.0.5",
    "tzdata>=2026.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # Allow Depends/File/Form/Query in FastAPI argument defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
