# Host ports for the API and the web app come from PMO_API_PORT and PMO_WEB_PORT
# (defaults 8000 and 3000; the Makefile sets and exports both). Inside the
# containers the servers always listen on 8000 and 3000.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pmo_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PMO_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/pmo_intelligence
      APP_ENV: development
      APP_DEBUG: "true"
      FRONTEND_URL: http://localhost:${PMO_WEB_PORT:-3000}
      AZURE_REDIRECT_URI: http://localhost:${PMO_WEB_PORT:-3000}/auth/callback/microsoft
      STORAGE_BACKEND: local
      LOCAL_UPLOAD_DIR: /app/uploads
      LOCAL_AUTH_ENABLED: "true"
      # Sign-in needs a role, so the e2e user (frontend/tests/e2e/auth.setup.ts)
      # is a bootstrap admin; set BOOTSTRAP_ADMIN_EMAILS to sign in as someone else
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-e2e@informationtechconsultants.com}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${PMO_API_PORT:-8000}/api/v1
    ports:
      - "${PMO_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
  upload_data:
